name: Clone Repository on EC2

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  clone:
    name: Clone Or Update Repo
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Clone or Update Repository
        run: |
          ssh -o StrictHostKeyChecking=no  ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'ENDSSH'
            set -euo pipefail

            REPO='${{ secrets.REPO }}'
            BRANCH='${{ github.ref_name }}'
            DEPLOY_PATH="$HOME/${REPO}"

            if [ ! -d "$DEPLOY_PATH/.git" ]; then
              git clone --branch "$BRANCH" https://github.com/${{ github.repository }}.git "$DEPLOY_PATH"
            else
              cd "$DEPLOY_PATH"
              git fetch origin
              git checkout "$BRANCH"
              git pull --ff-only origin "$BRANCH"
            fi
          ENDSSH
